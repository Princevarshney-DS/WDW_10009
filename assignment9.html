<!DOCTYPE html>
<html>
<head>
    <title>Quotation and Citation</title>
</head>
<body>

    <h2>Quotation and Citation Elements</h2>

    <h3>Quotation</h3>

    <p>
        My teacher said,
        <q>Practice makes a man perfect.</q>
    </p>

    <h3>Blockquote</h3>

    <blockquote>
        Education is the key to success.
        It helps us gain knowledge and skills.
    </blockquote>

    <h3>Citation</h3>

    <p>
        My favourite book is
        <cite>Wings of Fire</cite>.
    </p>

    <h3>Abbreviation</h3>

    <p>
        <abbr title="HyperText Markup Language">HTML</abbr>
        is used to create web pages.
    </p>

</body>
</html>
